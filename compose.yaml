# Local PostgreSQL only. API runs on host loopback using email-brain serve.
# Named volume: no live DB files in the checkout or Dropbox.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: email_brain
      POSTGRES_PASSWORD: ${EMAIL_BRAIN_POSTGRES_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - email_brain_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d email_brain"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  email_brain_postgres:
