[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cw-email-brain"
version = "0.1.0"
description = "Evidence-first, multi-user email intelligence infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "CW" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
]
api = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn>=0.30",
]
postgres = [
  "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["email_brain"]
