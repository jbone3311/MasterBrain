[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cw-email-brain"
version = "0.1.0"
description = "Evidence-first, multi-user email intelligence infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "CW" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "cryptography>=48,<51",
]

[project.optional-dependencies]
pdf-worker = ["pypdf==6.19.0"]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
  "pytest>=8,<10",
  "pypdf>=6.19,<7",
  "openpyxl>=3.1.5,<4",
  "python-docx>=1.2,<2",
]

[project.scripts]
email-brain = "email_brain.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable PostgreSQL database"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
email_brain = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["email_brain"]
