[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "masterbrain"
version = "0.2.0a2"
description = "Evidence-first intelligence across email and files"
readme = "README.md"
requires-python = ">=3.11.10,!=3.12.0,!=3.12.1,!=3.12.2,!=3.12.3,!=3.12.4,!=3.12.5"
license = { text = "Proprietary" }
authors = [{ name = "CW" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "cryptography>=48,<51",
  "PyJWT==2.14.0",
]

[project.optional-dependencies]
pdf-worker = ["pypdf==6.19.0"]
document-worker = [
  "pypdf==6.19.0",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
]
image-worker = [
  "pillow==11.3.0",
  "pytesseract==0.3.13",
]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
  "pytest>=8,<10",
  "pypdf>=6.19,<7",
  "openpyxl>=3.1.5,<4",
  "python-docx>=1.2,<2",
  "pillow==11.3.0",
  "pytesseract==0.3.13",
]

[project.scripts]
masterbrain = "masterbrain.cli:main"
email-brain = "email_brain.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable PostgreSQL database"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
email_brain = ["web/*"]
masterbrain = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "tests/fixtures/pinned_fos_master",  # Exact donor source; never reformatted.
  # Installed by the Factory and checked byte-for-byte against its templates at every bind;
  # editing them here would break that check, so they are never reformatted either.
  ".claude/hooks/cw_scope_guard.py",
  "_SYSTEM/tools/factory_import.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["email_brain", "masterbrain"]
