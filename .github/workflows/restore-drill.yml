name: Synthetic PostgreSQL restore drill

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "migrations/**"
      - "src/email_brain/**"
      - "src/masterbrain/**"
      - "scripts/restore_drill.py"
      - "tests/test_restore_drill.py"
      - ".github/workflows/restore-drill.yml"
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "src/email_brain/**"
      - "src/masterbrain/**"
      - "scripts/restore_drill.py"
      - "tests/test_restore_drill.py"
      - ".github/workflows/restore-drill.yml"

permissions:
  contents: read

jobs:
  logical-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q tests/test_restore_drill.py
      - name: Real PostgreSQL 17 synthetic dump and restore
        run: uv run python scripts/restore_drill.py --run-disposable
      # No dump upload, database credentials, external accounts or cloud secrets.
