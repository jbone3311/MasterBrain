name: Synthetic FileOS completion benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/fileos-completion-benchmark.yml
      - scripts/benchmark_fileos_v1_completion.py
      - src/masterbrain/datacore/persistence.py
      - migrations/0018_fileos_inventory_reconciliation.sql
      - migrations/0043_fileos_run_ledger_linear_validation.sql
  push:
    branches: [main]
    paths:
      - .github/workflows/fileos-completion-benchmark.yml
      - scripts/benchmark_fileos_v1_completion.py
      - src/masterbrain/datacore/persistence.py
      - migrations/0018_fileos_inventory_reconciliation.sql
      - migrations/0043_fileos_run_ledger_linear_validation.sql

permissions:
  contents: read

jobs:
  synthetic-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: email_brain_test_benchmark_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d email_brain_test_benchmark_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Compare one 3,000-row completion with and without the old trigger
        env:
          PYTHONPATH: src
        run: >-
          uv run python scripts/benchmark_fileos_v1_completion.py
          --admin-dsn postgresql://postgres:synthetic-ci-only@localhost:5432/email_brain_test_benchmark_ci
          --rows 3000
      # Synthetic rows only. No FOS-Master checkout, live root, account or dump upload.
