name: Strict sender runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: strict-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  supported:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.10", "3.12.6", "3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: email_brain_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d email_brain_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EMAIL_BRAIN_TEST_ADMIN_DSN: postgresql://postgres:synthetic-ci-only@localhost:5432/email_brain_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --python "${{ matrix.python }}"
      - run: uv run python -c "import sys; print(sys.version)"
      - run: uv run pytest -q tests/test_strict_runtime.py tests/test_rule_control.py tests/test_review_fixes.py
  unsupported:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.9", "3.12.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Actual unsupported interpreters must refuse both source entry points
        run: |
          python - <<'PY'
          import os, subprocess, sys
          print(sys.version)
          for package in ('masterbrain', 'email_brain'):
              result = subprocess.run(
                  [sys.executable, '-c', f'import {package}'],
                  env={**os.environ, 'PYTHONPATH': os.path.abspath('src')},
                  capture_output=True, text=True, timeout=15,
              )
              assert result.returncode != 0, package
              assert 'requires security-patched' in result.stderr, result.stderr
              print(package + ': unsupported runtime rejected at startup')
          PY
  strict-runtime-gate:
    if: ${{ always() }}
    needs: [supported, unsupported]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both runtime matrices to succeed
        env:
          SUPPORTED_RESULT: ${{ needs.supported.result }}
          UNSUPPORTED_RESULT: ${{ needs.unsupported.result }}
        run: |
          test "$SUPPORTED_RESULT" = success
          test "$UNSUPPORTED_RESULT" = success
