name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: email_brain_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d email_brain_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EMAIL_BRAIN_TEST_ADMIN_DSN: postgresql://postgres:synthetic-ci-only@localhost:5432/email_brain_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: node --test tests/web_session.test.cjs
      - run: node --test tests/web_processing.test.cjs
      - run: uv run python scripts/deployment_gate.py
      - run: uv run python scripts/check_docs.py
      - run: docker build -t email-brain-ci .
      - run: docker run --rm email-brain-ci --help
      - name: Independent fixture readers stay out of the runtime image
        run: >-
          docker run --rm --network none --entrypoint /app/.venv/bin/python email-brain-ci
          -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('pypdf', 'openpyxl', 'docx', 'lxml'))"
      - name: Actual isolated large-MIME recovery
        run: |
          image_id="$(docker image inspect email-brain-ci --format '{{.Id}}')"
          EMAIL_BRAIN_SANDBOX_IMAGE_ID="$image_id" uv run pytest -q tests/container_mime_checks.py
