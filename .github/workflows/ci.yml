name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: email_brain_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d email_brain_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EMAIL_BRAIN_TEST_ADMIN_DSN: postgresql://postgres:synthetic-ci-only@localhost:5432/email_brain_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: node --test tests/web_session.test.cjs
      - run: node --test tests/web_processing.test.cjs
      - run: node --test tests/web_documents.test.cjs
      - run: node --test tests/web_reader.test.cjs
      - run: node --test tests/web_memory.test.cjs
      - run: uv run python scripts/deployment_gate.py
      - run: uv run python scripts/check_docs.py
      - run: docker build -t email-brain-ci .
      - run: docker run --rm email-brain-ci --help
      - name: Independent fixture readers stay out of the runtime image
        run: >-
          docker run --rm --network none --entrypoint /app/.venv/bin/python email-brain-ci
          -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('pypdf', 'openpyxl', 'docx', 'lxml', 'PIL', 'pytesseract'))"
      - name: Actual isolated large-MIME recovery
        run: |
          image_id="$(docker image inspect email-brain-ci --format '{{.Id}}')"
          EMAIL_BRAIN_SANDBOX_IMAGE_ID="$image_id" uv run pytest -q tests/container_mime_checks.py
      - name: Build dedicated PDF worker (not the API image)
        run: docker build -f Dockerfile.pdf -t email-brain-pdf-ci .
      - name: Actual source-bound restricted PDF extraction
        run: |
          pdf_image_id="$(docker image inspect email-brain-pdf-ci --format '{{.Id}}')"
          EMAIL_BRAIN_PDF_IMAGE_ID="$pdf_image_id" uv run pytest -q tests/container_pdf_checks.py
      - name: Build dedicated FileOS document worker (not the API image)
        run: docker build -f Dockerfile.documents -t masterbrain-documents-ci .
      - name: Actual source-bound FileOS PDF and Office extraction
        run: |
          document_image_id="$(docker image inspect masterbrain-documents-ci --format '{{.Id}}')"
          MASTERBRAIN_DOCUMENT_IMAGE_ID="$document_image_id" uv run pytest -q tests/container_document_checks.py
      - name: Build dedicated FileOS image OCR worker (not the API image)
        run: docker build -f Dockerfile.images -t masterbrain-images-ci .
      - name: Actual byte-bound restricted FileOS image OCR
        run: |
          image_ocr_id="$(docker image inspect masterbrain-images-ci --format '{{.Id}}')"
          MASTERBRAIN_IMAGE_OCR_IMAGE_ID="$image_ocr_id" uv run pytest -q tests/container_image_ocr_checks.py
      - name: Build dedicated FileOS archive worker (not the API image)
        run: docker build -f Dockerfile.archives -t masterbrain-archives-ci .
      - name: Actual source-bound restricted FileOS archive inventory
        run: |
          archive_image_id="$(docker image inspect masterbrain-archives-ci --format '{{.Id}}')"
          MASTERBRAIN_ARCHIVE_IMAGE_ID="$archive_image_id" uv run pytest -q tests/container_archive_checks.py
      - name: Actual hash-bound restricted FileOS archive member read
        run: |
          archive_image_id="$(docker image inspect masterbrain-archives-ci --format '{{.Id}}')"
          MASTERBRAIN_ARCHIVE_IMAGE_ID="$archive_image_id" uv run pytest -q tests/container_archive_member_checks.py
      - name: Actual two-image FileOS archive document extraction
        run: |
          archive_image_id="$(docker image inspect masterbrain-archives-ci --format '{{.Id}}')"
          document_image_id="$(docker image inspect masterbrain-documents-ci --format '{{.Id}}')"
          MASTERBRAIN_ARCHIVE_IMAGE_ID="$archive_image_id" \
            MASTERBRAIN_DOCUMENT_IMAGE_ID="$document_image_id" \
            uv run pytest -q tests/container_archive_document_checks.py
      - name: Actual two-image FileOS archive image OCR
        run: |
          archive_image_id="$(docker image inspect masterbrain-archives-ci --format '{{.Id}}')"
          image_ocr_id="$(docker image inspect masterbrain-images-ci --format '{{.Id}}')"
          MASTERBRAIN_ARCHIVE_IMAGE_ID="$archive_image_id" \
            MASTERBRAIN_IMAGE_OCR_IMAGE_ID="$image_ocr_id" \
            uv run pytest -q tests/container_archive_image_ocr_checks.py
